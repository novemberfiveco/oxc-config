name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options: [cli, vite]
      increment:
        description: Release type
        type: choice
        required: true
        options: [patch, minor, major]
      preRelease:
        description: Prerelease channel (none = stable "latest" tag)
        type: choice
        required: true
        default: none
        options: [none, beta]

jobs:
  release:
    runs-on: ubuntu-latest
    # Built-in GITHUB_TOKEN pushes the version commit + tag and creates the GitHub
    # release — no GH_PUSH_TOKEN secret needed. NPM_TOKEN is the only secret to add.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - run: npm ci
      # NOTE: cutting a BETA of `vite` while `cli` is also beta won't resolve — vite depends
      # on cli via "^0.1.0", which excludes prereleases. For a both-beta cut, publish cli's
      # beta first, then point vite's cli dep at that exact beta version.
      - name: Release ${{ inputs.package }}
        run: |
          PRE=""
          if [ "${{ inputs.preRelease }}" = "beta" ]; then PRE="--preRelease=beta"; fi
          npm run release:${{ inputs.package }} -- -- --ci -V --increment ${{ inputs.increment }} $PRE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
