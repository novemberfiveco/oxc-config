name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        required: true
        options: [cli, vite]
      increment:
        description: Release type
        type: choice
        required: true
        options: [patch, minor, major]
      preRelease:
        description: Prerelease channel (none = stable "latest" tag)
        type: choice
        required: true
        default: none
        options: [none, beta]

jobs:
  release:
    runs-on: ubuntu-latest
    # Built-in GITHUB_TOKEN pushes the version commit + tag and creates the GitHub
    # release. OIDC (id-token: write) authenticates npm publish — no NPM_TOKEN needed.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: |
          # npm@latest now requires node >= 22.22.2; pin to 11.x,
          # which still satisfies trusted publishing's >= 11.5.1 floor
          npm install -g npm@11
          npm --version
      - run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - run: npm ci
      # NOTE: cutting a BETA of `vite` while `cli` is also beta won't resolve — vite depends
      # on cli via "^0.1.0", which excludes prereleases. For a both-beta cut, publish cli's
      # beta first, then point vite's cli dep at that exact beta version.
      - name: Release ${{ inputs.package }}
        run: |
          PRE=""
          if [ "${{ inputs.preRelease }}" = "beta" ]; then PRE="--preRelease=beta"; fi
          # checkout uses persist-credentials:false, so re-provide push auth for release-it's git push
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          npm run release:${{ inputs.package }} -- -- --ci -V --increment ${{ inputs.increment }} $PRE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
